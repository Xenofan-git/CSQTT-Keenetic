name: Build WPE VK OAuth ARM64 prototype
on:
  workflow_dispatch:
  push:
    branches: [wpe-vk-oauth-prototype]
    paths:
      - '.github/workflows/build-wpe-vk-oauth.yml'
      - 'tools/vk-oauth/**'
permissions:
  contents: read
env:
  WPE_VERSION: 2.52.4
  ENTWARE_BASE: https://bin.entware.net/aarch64-k3.10
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build pkg-config python3 python3-pip meson python3-setuptools perl ruby bison flex gperf gettext xz-utils binutils curl ca-certificates
      - name: Prepare Entware target sysroot
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          mkdir -p "$SYSROOT" "$RUNNER_TEMP/ipk"
          curl -fsSL "$ENTWARE_BASE/Packages" -o "$RUNNER_TEMP/Packages"
          get_url() {
            awk -v p="$1" '$1=="Package:" { name=$2 } $1=="Filename:" && name==p { print $2; exit }' "$RUNNER_TEMP/Packages"
          }
          extract_pkg() {
            pkg="$1"
            rel="$(get_url "$pkg")"
            if [ -z "$rel" ]; then
              echo "WARNING: Entware package $pkg is not present in the target index; skipping it"
              return 0
            fi
            curl --http1.1 --compressed -fsSL --retry 4 --retry-all-errors "$ENTWARE_BASE/$rel" -o "$RUNNER_TEMP/ipk/$pkg.ipk"
            file "$RUNNER_TEMP/ipk/$pkg.ipk"
            mkdir -p "$RUNNER_TEMP/ipk/$pkg"
            cd "$RUNNER_TEMP/ipk/$pkg"
            if ar t "../$pkg.ipk" >/dev/null 2>&1; then
              ar x "../$pkg.ipk"
              data="$(find . -maxdepth 1 -name 'data.tar.*' -print -quit)"
              test -n "$data"
              tar -xf "$data" -C "$SYSROOT" --strip-components=1
            else
              echo "Entware endpoint returned a gzip-compressed data archive; extracting directly"
              tar -xzf "../$pkg.ipk" -C "$SYSROOT" --strip-components=1
            fi
            cd "$GITHUB_WORKSPACE"
          }
          # Entware uses libpcre2 as the PCRE2 package name.
          for p in libc libgcc libstdcpp glib2 icu libsoup3 libfreetype fontconfig libpng libjpeg-turbo zlib libxml2 libxslt libffi libpcre2 libsqlite3 libopenssl libcares libpsl libidn2 libunistring libbrotlidec libbrotlienc libbrotlicommon libatomic libbz2 libzstd libexpat; do
            extract_pkg "$p"
          done
          mkdir -p "$SYSROOT/lib" "$SYSROOT/usr/lib"
          if [ -e "$SYSROOT/lib/ld-2.27.so" ]; then ln -sf ld-2.27.so "$SYSROOT/lib/ld-linux-aarch64.so.1"; fi
          # Entware runtime packages may omit unversioned linker symlinks used by CMake find_library().
          for lib in glib-2.0 gobject-2.0 gio-2.0 gmodule-2.0 gthread-2.0; do
            so="$(find "$SYSROOT/lib" -maxdepth 1 -name "lib${lib}.so.*" -print -quit)"
            if [ -n "$so" ] && [ ! -e "$SYSROOT/lib/lib${lib}.so" ]; then
              ln -sf "$(basename "$so")" "$SYSROOT/lib/lib${lib}.so"
            fi
          done
          echo "=== HarfBuzz package entries ==="
          awk 'BEGIN{RS=""} /[Pp]ackage:.*harf|[Ss]ection:.*harf/ {print}' "$RUNNER_TEMP/Packages" | head -80 || true
          echo "=== HarfBuzz files in sysroot ==="
          find "$SYSROOT" -type f \( -name "hb.h" -o -name "hb-version.h" -o -name "harfbuzz.pc" \) -print || true
          echo "=== HarfBuzz libraries ==="
          find "$SYSROOT" -type f -name "libharfbuzz.so*" -print || true
          du -sh "$SYSROOT"
      - name: Fetch WPE WebKit
        run: |
          set -euxo pipefail
          curl -fsSL "https://wpewebkit.org/releases/wpewebkit-${WPE_VERSION}.tar.xz" -o "$RUNNER_TEMP/wpe.tar.xz"
          echo "01ca34cd7af880c038d35aa94482fee785a77db37b614c584475d7d43b3a2dc0  $RUNNER_TEMP/wpe.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/wpe.tar.xz"
          mv "wpewebkit-${WPE_VERSION}" wpewebkit
      - name: Build minimal HarfBuzz for Entware
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          HB_VERSION=11.2.1
          curl -fsSL "https://github.com/harfbuzz/harfbuzz/releases/download/${HB_VERSION}/harfbuzz-${HB_VERSION}.tar.xz" -o "$RUNNER_TEMP/harfbuzz.tar.xz"
          tar -xf "$RUNNER_TEMP/harfbuzz.tar.xz" -C "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/harfbuzz-cross.txt" <<EOF
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          sys_root = '$SYSROOT'
          [built-in options]
          c_args = ['--sysroot=$SYSROOT']
          cpp_args = ['--sysroot=$SYSROOT']
          c_link_args = ['--sysroot=$SYSROOT']
          cpp_link_args = ['--sysroot=$SYSROOT']
          EOF
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig:$SYSROOT/share/pkgconfig:$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig"
          cd "$RUNNER_TEMP/harfbuzz-${HB_VERSION}"
          meson setup build-hb --cross-file "$RUNNER_TEMP/harfbuzz-cross.txt" --prefix=/opt/hb --libdir=lib --buildtype=minsize \
            -Dglib=disabled -Dfreetype=disabled -Dicu=enabled -Dgraphite2=disabled \
            -Dcairo=disabled -Dtests=disabled -Ddocs=disabled -Dutilities=disabled -Dbenchmark=disabled
          meson compile -C build-hb
          DESTDIR="$RUNNER_TEMP/hb-install" meson install -C build-hb
          cp -a "$RUNNER_TEMP/hb-install/opt/hb/." "$SYSROOT/"
          echo "=== Built HarfBuzz ==="
          find "$SYSROOT" -type f \( -name hb.h -o -name hb-version.h -o -name harfbuzz.pc -o -name 'libharfbuzz.so*' \) -print
          grep -E '^Version:' "$SYSROOT/lib/pkgconfig/harfbuzz.pc" || true
      - name: Configure ARM64 WPE
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          cat > "$RUNNER_TEMP/aarch64-entware.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_SYSROOT "$SYSROOT")
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH "$SYSROOT")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig:$SYSROOT/share/pkgconfig:$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig"
          export PKG_CONFIG_PATH=""
          cmake -S wpewebkit -B build-wpe -GNinja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/aarch64-entware.cmake" -DGLib_LIBRARY="$SYSROOT/lib/libglib-2.0.so" -DGLib_INCLUDE_DIR="$SYSROOT/include/glib-2.0" -DGLib_Config_INCLUDE_DIR="$SYSROOT/lib/glib-2.0/include" -DGLib_Object_LIBRARY="$SYSROOT/lib/libgobject-2.0.so" -DGLib_Thread_LIBRARY="$SYSROOT/lib/libgthread-2.0.so" -DGLib_Module_LIBRARY="$SYSROOT/lib/libgmodule-2.0.so" -DGLib_Gio_LIBRARY="$SYSROOT/lib/libgio-2.0.so" -DGLib_GioUnix_LIBRARY="$SYSROOT/lib/libgio-2.0.so" -DCMAKE_INSTALL_PREFIX=/opt -DPORT=WPE -DENABLE_WPE_PLATFORM=ON -DENABLE_WPE_PLATFORM_HEADLESS=ON -DENABLE_WPE_PLATFORM_WAYLAND=OFF -DENABLE_WPE_PLATFORM_DRM=OFF -DENABLE_WPE_LEGACY_API=OFF -DENABLE_COG=OFF -DENABLE_INTROSPECTION=OFF -DENABLE_DOCUMENTATION=OFF -DENABLE_MINIBROWSER=OFF -DENABLE_WEBDRIVER=OFF -DENABLE_WEBRTC=OFF -DENABLE_WEBXR=OFF -DENABLE_GAMEPAD=OFF -DENABLE_SPELLCHECK=OFF -DENABLE_PDFJS=OFF -DENABLE_XSLT=OFF -DENABLE_VIDEO=OFF -DENABLE_MEDIA_STREAM=OFF -DENABLE_WEB_AUDIO=OFF -DENABLE_MEDIA_SOURCE=OFF -DENABLE_MEDIA_RECORDER=OFF -DENABLE_BUBBLEWRAP_SANDBOX=OFF -DENABLE_JOURNALD_LOG=OFF -DUSE_GSTREAMER=OFF -DUSE_GSTREAMER_GL=OFF -DUSE_GSTREAMER_WEBRTC=OFF -DUSE_SKIA=ON -DUSE_WOFF2=OFF -DUSE_LIBHYPHEN=OFF -DUSE_OPENXR=OFF -DUSE_GBM=OFF -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF -DUSE_SYSTEM_UNIFDEF=OFF -DENABLE_EXPERIMENTAL_FEATURES=OFF
      - name: Build WPE
        run: cmake --build build-wpe --parallel 2
      - name: Build VK OAuth launcher
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig:$SYSROOT/share/pkgconfig"
          aarch64-linux-gnu-g++ --sysroot="$SYSROOT" -Os -ffunction-sections -fdata-sections -Wl,--gc-sections tools/vk-oauth/main.cpp -o build-wpe/vk-oauth $(pkg-config --cflags --libs wpe-webkit-2.0 glib-2.0 gio-2.0)
      - name: Package prototype
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/bin bundle/lib
          cp build-wpe/vk-oauth bundle/bin/
          find build-wpe -type f \( -name 'libWPEWebKit*.so*' -o -name 'WPEWebProcess' -o -name 'WPENetworkProcess' \) -exec cp -a {} bundle/lib/ \;
          cat > bundle/vk-oauth <<'EOF'
          #!/bin/sh
          BASE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$BASE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export WPE_PLATFORM=headless
          exec "$BASE/bin/vk-oauth" "$@"
          EOF
          chmod +x bundle/vk-oauth
          tar -C bundle -czf wpe-vk-oauth-arm64-entware.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: wpe-vk-oauth-arm64-entware
          path: wpe-vk-oauth-arm64-entware.tar.gz
          if-no-files-found: error
