name: One-shot VK blank auth fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-vk-blank.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch VK browser auth
        shell: python
        run: |
          from pathlib import Path
          p = Path("webpanel.go")
          s = p.read_text()

          old = 'q.Set("redirect_uri", vkCallbackURL(r))'
          new = 'q.Set("redirect_uri", vkWebRedirect)'
          if old not in s:
              raise SystemExit("redirect_uri pattern not found")
          s = s.replace(old, new, 1)

          old = '''    state := base64.RawURLEncoding.EncodeToString(b)

    vkTokenMu.Lock()'''
          new = '''    nonce := base64.RawURLEncoding.EncodeToString(b)
    scheme := "http"
    if strings.EqualFold(r.Header.Get("X-Forwarded-Proto"), "https") || r.TLS != nil {
        scheme = "https"
    }
    statePayload := scheme + "://" + strings.TrimSpace(r.Host) + "|" + nonce
    state := base64.RawURLEncoding.EncodeToString([]byte(statePayload))

    vkTokenMu.Lock()'''
          if old not in s:
              raise SystemExit("session state pattern not found")
          s = s.replace(old, new, 1)

          old = '''<p class="muted">Авторизация выполняется непосредственно в браузере. После входа VK возвращает access_token во фрагмент redirect-URL, а эта страница автоматически передаёт его в CSQTT.</p>
<div class="row"><button type="button" id="vkLogin">🔐 Войти через VK</button><button class="secondary" onclick="refresh()">Обновить</button></div>
<div id="msg" class="muted"></div>'''
          new = '''<p class="muted">VK-приложение 7793118 требует штатный redirect <code>https://oauth.vk.ru/blank.html</code>. После входа VK помещает access_token во фрагмент URL. Маленький браузерный скрипт забирает его и передаёт в CSQTT — APK не нужен.</p>
<div class="row"><button type="button" id="vkLogin">🔐 Войти через VK</button><button class="secondary" onclick="refresh()">Обновить</button></div>
<div id="msg" class="muted"></div>
<div style="margin-top:14px">
  <details>
    <summary>🧩 Установить скрипт для автоматического получения токена</summary>
    <p class="muted">Скрипт должен выполняться на странице <code>oauth.vk.ru/blank.html</code>. Для Firefox Android можно установить Violentmonkey и открыть файл userscript. В Chrome Android можно сохранить bookmarklet и запустить его из адресной строки.</p>
    <a href="/vk-auth.user.js" target="_blank">📥 Открыть CSQTT VK userscript</a>
    <textarea id="vkBookmarklet" readonly rows="4" style="width:100%;box-sizing:border-box;background:#101010;color:#9ecbff;border:1px solid #444;border-radius:10px;padding:11px;margin-top:10px"></textarea>
    <small>Bookmarklet: скопируй код в URL закладки с именем «CSQTT VK».</small>
  </details>
</div>'''
          if old not in s:
              raise SystemExit("panel auth block not found")
          s = s.replace(old, new, 1)

          old = '''    msg.textContent='Открываю VK…';
    window.location.href=u.url;'''
          new = '''    msg.textContent='Открываю VK… После авторизации скрипт на blank.html автоматически вернёт token в CSQTT.';
    window.location.href=u.url;'''
          if old not in s:
              raise SystemExit("login message pattern not found")
          s = s.replace(old, new, 1)

          old = '''async function refresh(){
  let r=await fetch('/api/vk/status');let x=await r.json();'''
          new = '''function updateVKBookmarklet(){
  const out=document.getElementById('vkBookmarklet');
  if(!out) return;
  const code="javascript:(()=>{const p=new URLSearchParams(location.hash.slice(1));const t=p.get('access_token');const u=p.get('user_id')||'';const e=p.get('expires_in')||'0';const s=p.get('state')||'';if(!t||!s){alert('CSQTT VK: token/state не найден');return;}let d=s.replace(/-/g,'+').replace(/_/g,'/');while(d.length%4)d+='=';let raw='';try{raw=decodeURIComponent(escape(atob(d)))}catch(_){alert('CSQTT VK: неверный state');return;}const i=raw.indexOf('|');const panel=raw.slice(0,i);if(!panel){alert('CSQTT VK: panel URL не найден');return;}const f=document.createElement('form');f.method='POST';f.action=panel+'/api/vk/token';[['token',t],['user_id',u],['expires_in',e],['state',s]].forEach(([n,v])=>{const x=document.createElement('input');x.type='hidden';x.name=n;x.value=v;f.appendChild(x)});document.documentElement.appendChild(f);f.submit();})();";
  out.value=code;
}
async function refresh(){
  updateVKBookmarklet();
  let r=await fetch('/api/vk/status');let x=await r.json();'''
          if old not in s:
              raise SystemExit("refresh pattern not found")
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Add userscript
        shell: bash
        run: |
          cat > vk-auth.user.js <<'EOF'
          // ==UserScript==
          // @name         CSQTT-Keenetic VK Auto Auth
          // @namespace    https://github.com/Xenofan-git/CSQTT-Keenetic
          // @version      1.0.0
          // @description  Returns VK implicit OAuth token from blank.html to CSQTT-Keenetic
          // @match        https://oauth.vk.ru/blank.html*
          // @match        https://oauth.vk.com/blank.html*
          // @run-at       document-start
          // ==/UserScript==

          (() => {
            const p = new URLSearchParams(location.hash.replace(/^#/, ""));
            const token = p.get("access_token") || "";
            const userId = p.get("user_id") || "";
            const expiresIn = p.get("expires_in") || "0";
            const state = p.get("state") || "";

            if (!token || !state) return;

            let decoded = state.replace(/-/g, "+").replace(/_/g, "/");
            while (decoded.length % 4) decoded += "=";

            let raw;
            try {
              raw = decodeURIComponent(escape(atob(decoded)));
            } catch (_) {
              return;
            }

            const separator = raw.indexOf("|");
            if (separator <= 0) return;

            const panel = raw.slice(0, separator);
            if (!/^https?:\\/\\//i.test(panel)) return;

            const form = document.createElement("form");
            form.method = "POST";
            form.action = panel + "/api/vk/token";
            form.style.display = "none";

            for (const [name, value] of [
              ["token", token],
              ["user_id", userId],
              ["expires_in", expiresIn],
              ["state", state],
            ]) {
              const input = document.createElement("input");
              input.type = "hidden";
              input.name = name;
              input.value = value;
              form.appendChild(input);
            }

            (document.documentElement || document.body).appendChild(form);
            form.submit();
          })();
          EOF

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webpanel.go vk-auth.user.js
          git commit -m "Fix browser VK auth through blank.html"
          git push
