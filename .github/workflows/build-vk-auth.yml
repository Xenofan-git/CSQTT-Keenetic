name: Build CSQTT VK Auth

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-vk-auth/**'
      - '.github/workflows/build-vk-auth.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-vk-auth
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: sha256sum android-vk-auth/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-VK-Auth-debug
          path: android-vk-auth/app/build/outputs/apk/debug/app-debug.apk
