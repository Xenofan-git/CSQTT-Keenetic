name: Build CSQTT client ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-client.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manager repo
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-unknown-linux-musl

      - name: Install Zig and cargo-zigbuild
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user ziglang
          ZIG_BIN="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          echo "ZIG_BIN=$ZIG_BIN"
          test -x "$ZIG_BIN"
          echo "$(dirname "$ZIG_BIN")" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
          rustc --version
          cargo --version
          "$ZIG_BIN" version
          cargo zigbuild --help >/dev/null

      - name: Download CSQTT source 2.1.9
        run: |
          curl -L --fail -o csqtt.tar.gz https://github.com/amurcanov/csqtt/archive/refs/tags/v2.1.9.tar.gz
          tar -xzf csqtt.tar.gz

      - name: Patch musl UDP and ARM64 compatibility
        working-directory: csqtt-2.1.9/rust-client
        run: |
          set -e

          # zstd-sys 2.0.16+zstd.1.5.7 unconditionally adds the x86-64
          # huf_decompress_amd64.S unless its no_asm feature is enabled.
          # That assembly cannot be compiled for aarch64-musl. Make the
          # feature part of the dependency graph so Cargo enables it for the
          # transitive zstd-sys used by the CSQTT dependency chain.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          dep = 'zstd-sys = { version = "2.0.16", features = ["no_asm"] }'
          if dep not in s:
              marker = 'getrandom = "0.4"\n'
              if marker not in s:
                  raise SystemExit('Cargo.toml insertion marker not found')
              s = s.replace(marker, marker + dep + '\n', 1)
              p.write_text(s)
          print('=== zstd ARM64 compatibility ===')
          print(dep)
          PY

          # Be tolerant of either c_int or c_uint in the upstream wrapper.
          sed -i 's/count: libc::c_int/count: libc::c_uint/g' udp_batch.rs
          # Explicitly cast the Linux libc vlen argument to the ABI type.
          sed -i 's/libc::recvmmsg(fd, messages, count, flags, timeout)/libc::recvmmsg(fd, messages, count as libc::c_uint, flags, timeout)/g' udp_batch.rs
          sed -i 's/libc::sendmmsg(fd, messages, count, flags)/libc::sendmmsg(fd, messages, count as libc::c_uint, flags)/g' udp_batch.rs
          # libc 0.2.189 exposes musl msghdr padding fields as private. Avoid
          # struct-literal construction and initialize the public fields after
          # zeroing the ABI struct.
          perl -0pi -e 's{    fn mmsg_header\(iovec: \*mut libc::iovec\) -> libc::mmsghdr \{\n        libc::mmsghdr \{\n            msg_hdr: libc::msghdr \{\n                msg_name: ptr::null_mut\(\),\n                msg_namelen: 0,\n                msg_iov: iovec,\n                msg_iovlen: 1,\n                msg_control: ptr::null_mut\(\),\n                msg_controllen: 0,\n                msg_flags: 0,\n            \},\n            msg_len: 0,\n        \}\n    \}}{    fn mmsg_header(iovec: *mut libc::iovec) -> libc::mmsghdr {\n        let mut msg_hdr: libc::msghdr = unsafe { std::mem::zeroed() };\n        msg_hdr.msg_name = ptr::null_mut();\n        msg_hdr.msg_namelen = 0;\n        msg_hdr.msg_iov = iovec;\n        msg_hdr.msg_iovlen = 1;\n        msg_hdr.msg_control = ptr::null_mut();\n        msg_hdr.msg_controllen = 0;\n        msg_hdr.msg_flags = 0;\n        libc::mmsghdr {\n            msg_hdr,\n            msg_len: 0,\n        }\n    }}' udp_batch.rs

          echo '=== compatibility patch check ==='
          grep -n -A8 'unsafe fn recv_mmsg\|unsafe fn send_mmsg' udp_batch.rs
          grep -n -A14 'fn mmsg_header' udp_batch.rs
          grep -n 'zstd-sys' Cargo.toml

      - name: Build ARM64 client
        working-directory: csqtt-2.1.9/rust-client
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '0'
          AWS_LC_SYS_STATIC: '1'
          RUST_BACKTRACE: '1'
          CC_aarch64_unknown_linux_musl: 'zig cc -target aarch64-linux-musl'
          AR_aarch64_unknown_linux_musl: 'zig ar'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: 'zig cc'
        run: |
          echo '=== toolchain ==='
          rustc --version
          cargo --version
          zig version
          echo '=== target ==='
          rustc --print target-spec-json --target aarch64-unknown-linux-musl 2>/dev/null || true
          echo '=== cross compiler ==='
          zig cc -target aarch64-linux-musl --version
          echo '=== cargo build ==='
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl -vv
          file target/aarch64-unknown-linux-musl/release/client
          readelf -h target/aarch64-unknown-linux-musl/release/client
          readelf -d target/aarch64-unknown-linux-musl/release/client || true
          sha256sum target/aarch64-unknown-linux-musl/release/client

      - name: Package
        run: |
          mkdir -p dist
          cp csqtt-2.1.9/rust-client/target/aarch64-unknown-linux-musl/release/client dist/client
          chmod 755 dist/client
          tar -C dist -czf CSQTT-client-2.1.9-aarch64-k3.10.tar.gz client
          sha256sum dist/client CSQTT-client-2.1.9-aarch64-k3.10.tar.gz | tee SHA256SUMS

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-client-2.1.9-aarch64-k3.10
          path: |
            dist/client
            CSQTT-client-2.1.9-aarch64-k3.10.tar.gz
            SHA256SUMS
