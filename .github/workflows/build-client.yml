name: Build CSQTT client ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-client.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manager repo
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-musl

      - name: Install Zig and cargo-zigbuild
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user ziglang
          ZIG_BIN="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          echo "ZIG_BIN=$ZIG_BIN"
          test -x "$ZIG_BIN"
          echo "$(dirname "$ZIG_BIN")" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
          rustc --version
          cargo --version
          "$ZIG_BIN" version
          cargo zigbuild --help >/dev/null

      - name: Download CSQTT source 2.1.9
        run: |
          curl -L --fail -o csqtt.tar.gz https://github.com/amurcanov/csqtt/archive/refs/tags/v2.1.9.tar.gz
          tar -xzf csqtt.tar.gz

      - name: Patch musl UDP batch compatibility
        working-directory: csqtt-2.1.9/rust-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("udp_batch.rs")
          s = p.read_text()
          original = s

          # libc's Linux-musl recvmmsg/sendmmsg vlen parameter is c_uint.
          # Keep the wrappers explicitly aligned with that ABI.
          s = s.replace(
              "messages: *mut libc::mmsghdr,\n        count: libc::c_int,",
              "messages: *mut libc::mmsghdr,\n        count: libc::c_uint,",
          )

          # Newer libc makes musl msghdr padding fields private. Construct it
          # with zeroed memory and assign the public fields instead of using a
          # struct literal that must mention the private padding fields.
          old = '''    fn mmsg_header(iovec: *mut libc::iovec) -> libc::mmsghdr {
        libc::mmsghdr {
            msg_hdr: libc::msghdr {
                msg_name: ptr::null_mut(),
                msg_namelen: 0,
                msg_iov: iovec,
                msg_iovlen: 1,
                msg_control: ptr::null_mut(),
                msg_controllen: 0,
                msg_flags: 0,
            },
            msg_len: 0,
        }
    }
'''
          new = '''    fn mmsg_header(iovec: *mut libc::iovec) -> libc::mmsghdr {
        let mut msg_hdr: libc::msghdr = unsafe { std::mem::zeroed() };
        msg_hdr.msg_name = ptr::null_mut();
        msg_hdr.msg_namelen = 0;
        msg_hdr.msg_iov = iovec;
        msg_hdr.msg_iovlen = 1;
        msg_hdr.msg_control = ptr::null_mut();
        msg_hdr.msg_controllen = 0;
        msg_hdr.msg_flags = 0;
        libc::mmsghdr {
            msg_hdr,
            msg_len: 0,
        }
    }
'''
          if old not in s:
              raise SystemExit("Expected mmsg_header implementation was not found; refusing an unsafe patch")
          s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit("Patch made no changes")
          p.write_text(s)
          print("Patched udp_batch.rs for current musl libc")
          PY

          echo '=== patched signatures ==='
          grep -n -A6 'unsafe fn recv_mmsg\|unsafe fn send_mmsg' udp_batch.rs
          echo '=== patched msghdr constructor ==='
          grep -n -A16 'fn mmsg_header' udp_batch.rs

      - name: Build ARM64 client
        working-directory: csqtt-2.1.9/rust-client
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '0'
          AWS_LC_SYS_STATIC: '1'
          RUST_BACKTRACE: '1'
          CC_aarch64_unknown_linux_musl: 'zig cc -target aarch64-linux-musl'
          AR_aarch64_unknown_linux_musl: 'zig ar'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: 'zig cc'
        run: |
          echo '=== toolchain ==='
          rustc --version
          cargo --version
          zig version
          echo '=== target ==='
          rustc --print target-spec-json --target aarch64-unknown-linux-musl 2>/dev/null || true
          echo '=== cross compiler ==='
          zig cc -target aarch64-linux-musl --version
          echo '=== cargo build ==='
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl -vv
          file target/aarch64-unknown-linux-musl/release/client
          readelf -h target/aarch64-unknown-linux-musl/release/client
          readelf -d target/aarch64-unknown-linux-musl/release/client || true
          sha256sum target/aarch64-unknown-linux-musl/release/client

      - name: Package
        run: |
          mkdir -p dist
          cp csqtt-2.1.9/rust-client/target/aarch64-unknown-linux-musl/release/client dist/client
          chmod 755 dist/client
          tar -C dist -czf CSQTT-client-2.1.9-aarch64-k3.10.tar.gz client
          sha256sum dist/client CSQTT-client-2.1.9-aarch64-k3.10.tar.gz | tee SHA256SUMS

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-client-2.1.9-aarch64-k3.10
          path: |
            dist/client
            CSQTT-client-2.1.9-aarch64-k3.10.tar.gz
            SHA256SUMS
