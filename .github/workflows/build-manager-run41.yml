name: Build CSQTT-Keenetic manager Run 41

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.go'
      - 'webpanel.go'
      - 'deploy.go'
      - 'config.example.json'
      - 'go.mod'
      - '.github/workflows/build-manager-run41.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Test host
        run: go test ./...

      - name: Build ARM64 static
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags='-s -w' -o CSQTT-Keenetic-arm64 .
          file CSQTT-Keenetic-arm64
          sha256sum CSQTT-Keenetic-arm64

      - name: Package
        run: |
          tar -czf CSQTT-Keenetic-arm64-run41.tar.gz CSQTT-Keenetic-arm64
          sha256sum CSQTT-Keenetic-arm64-run41.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-Keenetic-arm64-run41
          path: |
            CSQTT-Keenetic-arm64
            CSQTT-Keenetic-arm64-run41.tar.gz
