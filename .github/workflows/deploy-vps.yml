name: Deploy VK Auth package to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 package
        uses: docker://golang:1.25-bookworm
        with:
          args: >-
            go build -trimpath -ldflags="-s -w"
            -o /github/workspace/dist/csqtt-vk-auth
            /github/workspace/tools/vk-auth

      - name: Prepare package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf package
          mkdir -p package/opt/bin package/opt/etc/csqtt package/opt/etc/init.d
          install -m 0755 dist/csqtt-vk-auth package/opt/bin/csqtt-vk-auth
          install -m 0755 tools/vk-auth/S98csqtt-vk-auth package/opt/etc/init.d/S98csqtt-vk-auth
          tar -C package -czf csqtt-vk-auth-arm64-entware.tar.gz .

      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euxo pipefail
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload package to VPS
        shell: bash
        run: |
          set -euxo pipefail
          PORT="${{ secrets.VPS_PORT || 22 }}"
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER }}"
          DEST="${{ secrets.VPS_DEPLOY_PATH || '/opt/csqtt-vk-auth' }}"
          test -n "$HOST"
          test -n "$USER"
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p '$DEST'"
          scp -P "$PORT" csqtt-vk-auth-arm64-entware.tar.gz "$USER@$HOST:$DEST/"
          ssh -p "$PORT" "$USER@$HOST" "cd '$DEST' && sha256sum csqtt-vk-auth-arm64-entware.tar.gz"
