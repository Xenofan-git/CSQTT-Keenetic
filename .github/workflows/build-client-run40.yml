name: Build CSQTT client ARM64 Run 40

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-client-run40.yml'
      - 'patches/csqтt-core/rust-client/tun.rs'
      - 'scripts/add-dispatch-diagnostic.py'
      - 'patches/csqтt-core/rust-client/flow_frame-csq5.patch'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manager repo
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-unknown-linux-musl

      - name: Install rustfmt
        run: |
          rustup component add rustfmt --toolchain 1.98.1-x86_64-unknown-linux-gnu
          rustfmt --version

      - name: Install Zig and cargo-zigbuild
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user ziglang
          ZIG_BIN="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          echo "$(dirname "$ZIG_BIN")" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Download CSQTT source 2.1.9
        run: |
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git csqtt-2.1.9

      - name: Add CSQ5 downlink frame compatibility
        run: |
          set -euo pipefail
          cd csqtt-2.1.9
          git apply ../patches/csqтt-core/rust-client/flow_frame-csq5.patch
          grep -q 'CSQ5_MAGIC' shared/flow_frame.rs

      - name: Apply Linux TUN receiver
        run: |
          cp patches/csqтt-core/rust-client/tun.rs csqtt-2.1.9/rust-client/tun.rs
          grep -q 'ScmRights' csqtt-2.1.9/rust-client/tun.rs

      - name: Add dispatcher diagnostics
        run: |
          python3 scripts/add-dispatch-diagnostic.py
          grep -q '\[CSQTT DEBUG\] DISPATCH queued' csqtt-2.1.9/rust-client/dispatcher.rs

      - name: Add Run40 TUN diagnostics and EINVAL recovery
        working-directory: csqtt-2.1.9/rust-client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dispatcher.rs')
          s = p.read_text()
          if 'TunWriteState::DropPacket' not in s:
              s = s.replace('    Failed,\n}', '    Failed,\n    DropPacket,\n}', 1)
          s = s.replace('''                TunWriteState::Complete | TunWriteState::Wait => {}\n                TunWriteState::Backoff => {''', '''                TunWriteState::Complete | TunWriteState::Wait => {}\n                TunWriteState::DropPacket => {\n                    crate::log_error!("[TUN DEBUG] EINVAL packet dropped; keeping TUN data-plane alive");\n                    pending = None;\n                }\n                TunWriteState::Backoff => {''', 1)
          read = '''                        stats\n                            .total_bytes_up\n                            .fetch_add(length as i64, Ordering::Relaxed);\n                        self.dispatch(&mut scheduler, packet);'''
          repl = '''                        stats\n                            .total_bytes_up\n                            .fetch_add(length as i64, Ordering::Relaxed);\n                        let data = packet.as_slice();\n                        let version = data.first().map(|b| b >> 4).unwrap_or(0);\n                        let preview = data.iter().take(16).map(|b| format!("{b:02x}")).collect::<Vec<_>>().join(" ");\n                        crate::log_error!("[TUN DEBUG] READ len={} ipver={} first16={}", length, version, preview);\n                        self.dispatch(&mut scheduler, packet);'''
          if read not in s: raise SystemExit('TUN read block not found')
          s = s.replace(read, repl, 1)
          err = '''            Ok(Err(error)) => {\n                crate::log_error!("[ОШИБКА] Запись TUN завершена: {error}");\n                TunWriteState::Failed\n            }\n            Err(_) => TunWriteState::Wait,'''
          err2 = '''            Ok(Err(error)) => {\n                if error.raw_os_error() == Some(libc::EINVAL) {\n                    let data = packet.as_slice();\n                    let version = data.first().map(|b| b >> 4).unwrap_or(0);\n                    let first32 = data.iter().take(32).map(|b| format!("{b:02x}")).collect::<Vec<_>>().join(" ");\n                    if version == 4 && data.len() >= 20 {\n                        let ihl = (data[0] & 0x0f) * 4;\n                        let total_len = u16::from_be_bytes([data[2], data[3]]);\n                        crate::log_error!("[TUN DEBUG] EINVAL len={} IPv4 src={}.{}.{}.{} dst={}.{}.{}.{} proto={} ihl={} total_len={} first32={}", data.len(), data[12], data[13], data[14], data[15], data[16], data[17], data[18], data[19], data[9], ihl, total_len, first32);\n                    } else if version == 6 && data.len() >= 40 {\n                        let payload_len = u16::from_be_bytes([data[4], data[5]]);\n                        crate::log_error!("[TUN DEBUG] EINVAL len={} IPv6 next_header={} payload_len={} first32={}", data.len(), data[6], payload_len, first32);\n                    } else {\n                        crate::log_error!("[TUN DEBUG] EINVAL len={} non-IP-or-short ipver={} first32={}", data.len(), version, first32);\n                    }\n                    return TunWriteState::DropPacket;\n                }\n                crate::log_error!("[ОШИБКА] Запись TUN завершена: {error}");\n                TunWriteState::Failed\n            }\n            Err(_) => TunWriteState::Wait,'''
          if err not in s: raise SystemExit('TUN write block not found')
          s = s.replace(err, err2, 1)
          p.write_text(s)
          PY

      - name: Patch musl UDP and ARM64 compatibility
        working-directory: csqtt-2.1.9/rust-client
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          dep = 'zstd-sys = { version = "2.0.16", features = ["no_asm"] }'
          if dep not in s:
              marker = 'getrandom = "0.4"\n'
              if marker not in s: raise SystemExit('Cargo marker not found')
              p.write_text(s.replace(marker, marker + dep + '\n', 1))
          PY
          sed -i 's/count: libc::c_int/count: libc::c_uint/g' udp_batch.rs
          sed -i 's/libc::recvmmsg(fd, messages, count, flags, timeout)/libc::recvmmsg(fd, messages, count as libc::c_uint, flags as libc::c_uint, timeout)/g' udp_batch.rs
          sed -i 's/libc::sendmmsg(fd, messages, count, flags)/libc::sendmmsg(fd, messages, count as libc::c_uint, flags as libc::c_uint)/g' udp_batch.rs
          perl -0pi -e 's{    fn mmsg_header\(iovec: \*mut libc::iovec\) -> libc::mmsghdr \{.*?^    \}}{    fn mmsg_header(iovec: *mut libc::iovec) -> libc::mmsghdr {\n        let mut msg_hdr: libc::msghdr = unsafe { std::mem::zeroed() };\n        msg_hdr.msg_name = ptr::null_mut();\n        msg_hdr.msg_namelen = 0;\n        msg_hdr.msg_iov = iovec;\n        msg_hdr.msg_iovlen = 1;\n        msg_hdr.msg_control = ptr::null_mut();\n        msg_hdr.msg_controllen = 0;\n        msg_hdr.msg_flags = 0;\n        libc::mmsghdr { msg_hdr, msg_len: 0 }\n    }}ms' udp_batch.rs

      - name: Build ARM64 client
        working-directory: csqtt-2.1.9/rust-client
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '0'
          AWS_LC_SYS_STATIC: '1'
          AWS_LC_SYS_CFLAGS_aarch64_unknown_linux_musl: '-D__ARM_ARCH=8'
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/zig-cc-aarch64-musl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args=(); skip_next=0
          for arg in "$@"; do
            if [[ "$skip_next" -eq 1 ]]; then skip_next=0; continue; fi
            case "$arg" in
              --target|-target) skip_next=1; continue;;
              --target=*|-target=*) continue;;
              -Wl,--fix-cortex-a53-843419) continue;;
              */rustlib/aarch64-unknown-linux-musl/lib/self-contained/crt1.o|*/rustlib/aarch64-unknown-linux-musl/lib/self-contained/crti.o|*/rustlib/aarch64-unknown-linux-musl/lib/self-contained/crtbegin.o|*/rustlib/aarch64-unknown-linux-musl/lib/self-contained/crtend.o|*/rustlib/aarch64-unknown-linux-musl/lib/self-contained/crtn.o) continue;;
              *) args+=("$arg");;
            esac
          done
          exec zig cc -target aarch64-linux-musl "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zig-cc-aarch64-musl"
          CC_aarch64_unknown_linux_musl="$RUNNER_TEMP/zig-cc-aarch64-musl" AR_aarch64_unknown_linux_musl='zig ar' AWS_LC_SYS_CC="$RUNNER_TEMP/zig-cc-aarch64-musl" AWS_LC_SYS_TARGET_CC="$RUNNER_TEMP/zig-cc-aarch64-musl" CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$RUNNER_TEMP/zig-cc-aarch64-musl" cargo zigbuild --release --target aarch64-unknown-linux-musl -vv
          file target/aarch64-unknown-linux-musl/release/client
          sha256sum target/aarch64-unknown-linux-musl/release/client

      - name: Verify Run40 diagnostics
        working-directory: csqtt-2.1.9/rust-client
        run: |
          grep -q 'ScmRights' tun.rs
          grep -q '\[CSQTT DEBUG\] DISPATCH queued' dispatcher.rs
          grep -q 'TunWriteState::DropPacket' dispatcher.rs
          grep -q '\[TUN DEBUG\] EINVAL' dispatcher.rs
          grep -q '\[TUN DEBUG\] READ' dispatcher.rs

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp csqtt-2.1.9/rust-client/target/aarch64-unknown-linux-musl/release/client dist/client
          chmod 755 dist/client
          tar -C dist -czf CSQTT-client-2.1.9-aarch64-k3.10-run40.tar.gz client
          sha256sum dist/client CSQTT-client-2.1.9-aarch64-k3.10-run40.tar.gz | tee SHA256SUMS

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-client-2.1.9-aarch64-k3.10-run40
          path: |
            dist/client
            CSQTT-client-2.1.9-aarch64-k3.10-run40.tar.gz
            SHA256SUMS
