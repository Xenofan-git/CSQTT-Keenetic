name: Build CSQTT client ARM64 Run 37 Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manager repo
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-unknown-linux-musl

      - name: Install rustfmt
        run: |
          rustup component add rustfmt --toolchain 1.98.1-x86_64-unknown-linux-gnu
          rustfmt --version

      - name: Install Zig and cargo-zigbuild
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --user ziglang
          ZIG_BIN="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          test -x "$ZIG_BIN"
          echo "$(dirname "$ZIG_BIN")" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
          "$ZIG_BIN" version

      - name: Download CSQTT source 2.1.9
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git csqtt-2.1.9
          test -f csqtt-2.1.9/rust-client/Cargo.toml

      - name: Apply Linux UDS SCM_RIGHTS TUN receiver
        run: |
          set -euo pipefail
          cp patches/csqтt-core/rust-client/tun.rs csqtt-2.1.9/rust-client/tun.rs
          grep -q 'ScmRights' csqtt-2.1.9/rust-client/tun.rs
          grep -q 'UnixAddr::new_abstract' csqtt-2.1.9/rust-client/tun.rs
          grep -q 'MSG_NOSIGNAL' csqtt-2.1.9/rust-client/tun.rs

      - name: Add TUN EINVAL diagnostics
        working-directory: csqtt-2.1.9/rust-client
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dispatcher.rs')
          s = p.read_text()
          start = s.index('fn try_write_tun_packet')
          pos = s.index('            Ok(Err(error)) => {', start)
          end = s.index('            Err(_) => TunWriteState::Wait,', pos)
          new = '''            Ok(Err(error)) => {
                if error.raw_os_error() == Some(libc::EINVAL) {
                    let data = packet.as_slice();
                    let bytes = data.iter().take(32)
                        .map(|b| format!("{b:02x}"))
                        .collect::<Vec<_>>().join(" ");
                    let version = data.first().map(|b| b >> 4).unwrap_or(0);
                    let header = if version == 4 && data.len() >= 20 {
                        format!("IPv4 {}.{}.{}.{} -> {}.{}.{}.{} proto={} ihl={} total_len={}", data[12], data[13], data[14], data[15], data[16], data[17], data[18], data[19], data[9], (data[0] & 0x0f) * 4, u16::from_be_bytes([data[2], data[3]]))
                    } else if version == 6 && data.len() >= 40 {
                        format!("IPv6 next_header={} payload_len={}", data[6], u16::from_be_bytes([data[4], data[5]]))
                    } else {
                        format!("non-IP-or-short version={} len={}", version, data.len())
                    };
                    crate::log_error!("[TUN DEBUG] EINVAL len={} {} first32={}", data.len(), header, bytes);
                }
                crate::log_error!("[ОШИБКА] Запись TUN завершена: {error}");
                TunWriteState::Failed
            }
'''
          p.write_text(s[:pos] + new + s[end:])
          PY

      - name: Patch musl UDP and ARM64 compatibility
        working-directory: csqtt-2.1.9/rust-client
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          dep = 'zstd-sys = { version = "2.0.16", features = ["no_asm"] }'
          if dep not in s:
              marker = 'getrandom = "0.4"\n'
              if marker not in s: raise SystemExit('Cargo.toml insertion marker not found')
              p.write_text(s.replace(marker, marker + dep + '\n', 1))
          PY
          sed -i 's/count: libc::c_int/count: libc::c_uint/g' udp_batch.rs
          sed -i 's/libc::recvmmsg(fd, messages, count, flags, timeout)/libc::recvmmsg(fd, messages, count as libc::c_uint, flags as libc::c_uint, timeout)/g' udp_batch.rs
          sed -i 's/libc::sendmmsg(fd, messages, count, flags)/libc::sendmmsg(fd, messages, count as libc::c_uint, flags as libc::c_uint)/g' udp_batch.rs

      - name: Build ARM64 client
        working-directory: csqtt-2.1.9/rust-client
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '0'
          AWS_LC_SYS_STATIC: '1'
          AWS_LC_SYS_CFLAGS_aarch64_unknown_linux_musl: '-D__ARM_ARCH=8'
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --user ziglang
          ZIG_BIN="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          export PATH="$(dirname "$ZIG_BIN"):$PATH"
          cargo zigbuild --release --target aarch64-unknown-linux-musl -vv
          file target/aarch64-unknown-linux-musl/release/client
          sha256sum target/aarch64-unknown-linux-musl/release/client

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp csqtt-2.1.9/rust-client/target/aarch64-unknown-linux-musl/release/client dist/client
          chmod 755 dist/client
          tar -C dist -czf CSQTT-client-2.1.9-aarch64-k3.10-run37-fixed.tar.gz client
          sha256sum dist/client CSQTT-client-2.1.9-aarch64-k3.10-run37-fixed.tar.gz | tee SHA256SUMS

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-client-2.1.9-aarch64-k3.10-run37-fixed
          path: |
            dist/client
            CSQTT-client-2.1.9-aarch64-k3.10-run37-fixed.tar.gz
            SHA256SUMS
