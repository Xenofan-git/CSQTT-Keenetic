name: Build CSQTT VK Auth APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-vk-auth/**'
      - '.github/workflows/build-vk-auth-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-vk-auth
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CSQTT-VK-Auth-debug
          path: android-vk-auth/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
